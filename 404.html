<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Pride World City</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><text x='50' y='68' font-size='55' font-family='serif' font-weight='bold' fill='%23d4af37' text-anchor='middle'>P</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=20261127i">
  <style>
    .error-hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem;
      background: radial-gradient(circle at center, rgba(197, 160, 89, 0.12) 0%, transparent 70%), var(--bg-primary);
    }
    .error-card {
      max-width: 580px;
      padding: 3.5rem 2.5rem;
      background: var(--bg-card);
      border: 1.5px solid var(--border-gold);
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(184, 134, 11, 0.15);
    }
    .error-code {
      font-family: var(--font-serif);
      font-size: 5.5rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #dfc285, #b8860b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="error-hero">
    <div class="error-card">
      <div style="margin-bottom: 1.5rem;">
        <img src="assets/images/pride-world-city-logo.svg" alt="Pride World City" style="height: 48px; width: auto;" width="180" height="48" />
      </div>
      <div class="error-code">404</div>
      <h1 style="font-size: 1.6rem; color: var(--text-main); margin-bottom: 0.75rem;">Page Horizon Not Found</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
        The sanctuary or enclave page you are looking for has been relocated or does not exist. Explore the 400-acre masterplan directly from the portal.
      </p>
      <div style="display: flex; gap: 0.85rem; justify-content: center; flex-wrap: wrap;">
        <a href="/" class="btn btn-gold">
          <i class="fa-solid fa-house"></i> Return to Homepage
        </a>
        <a href="/valencia" class="btn btn-glass">
          <i class="fa-solid fa-sun"></i> Valencia (New Launch)
        </a>
      </div>
    </div>
  </div>
</body>
</html>
